# ==============================================================================
# 安全提示与免责声明（请务必阅读）：
# 1. 本服务默认【没有启用登录鉴权】，Web 控制台可直接控制已登录的 Telegram 账号与配置。
# 2. 仅适合个人在可信内网 / 局域网 / NAS 环境自用，严禁直接暴露到公网！
# 3. 如确需跨网访问，请自行在可信反代层加鉴权与 HTTPS，或配置 TGBOT_ADMIN_USERNAME / PASSWORD。
# 4. 因暴露公网、配置不当或违规使用造成的账号封禁、信息泄露及一切后果，项目作者概不负责。
# ==============================================================================

services:
  telebot:
    build: .
    container_name: telebot
    restart: unless-stopped
    ports:
      # 默认映射 8088 方便内网/NAS 直连；如仅限本机访问可改为 "127.0.0.1:8088:8088"
      - "8088:8088"
    environment:
      TZ: Asia/Shanghai
      TGBOT_CONFIG: /app/config/config.json
      TGBOT_ADMIN_HOST: 0.0.0.0
      TGBOT_ADMIN_PORT: 8088
      # 可选：启用后台基础登录页（默认留空即无登录鉴权）
      # TGBOT_ADMIN_USERNAME: admin
      # TGBOT_ADMIN_PASSWORD: change-me
      # 可选：如需代理访问 Telegram 或 AI API，取消下方注释
      # HTTP_PROXY: http://127.0.0.1:7890
      # HTTPS_PROXY: http://127.0.0.1:7890
    volumes:
      # 使用目录挂载，避免容器内原子保存 config.json 触发文件忙错误
      - ./config:/app/config
      - ./sessions:/app/sessions
      - ./runtime:/app/runtime
